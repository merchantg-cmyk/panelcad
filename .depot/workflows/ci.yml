# Same suite as .github/workflows/ci.yml. Depot CI is what actually
# executes this file on an Origin-hosted repo, and only after the Depot
# app is connected to the namespace and this path exists on the default
# branch. See docs/RELEASE.md. Until then, run ./scripts/check.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libegl1 \
            libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-xfixes0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install PanelCAD
        run: python -m pip install -e ".[dev]"

      - name: pytest (headless)
        run: bash scripts/check
