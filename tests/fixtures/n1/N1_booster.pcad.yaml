      hp: 15.0
      voltage: 480.0
      FLA: 21.0
      table_flc: 21.0
      fla_source: nec-table
      sizing_summary: '15 hp, 480 V, 3-phase, squirrel-cage (other than Design B energy-efficient).

        480 V: 480 V system uses the 460 V rated-motor column (460 V). Amperes are
        the published cell, not a ratio.

        Full-load current 21 A from NEC Table 430.250, 460 V column.

        No nameplate current was given. The overload uses the table full-load current
        as a placeholder. NEC 430.6(A)(2) and 430.32 require the nameplate current
        before this ships.

        Branch conductors: 21 A × 1.25 = 26.25 A minimum (NEC 430.22).

        UL 508A 29.6 (UL 508A value, not verified against the standard): no termination
        temperature is marked, and the branch device is 60 A (100 A or less), so the
        60°C column is used.

        NEC Table 310.16 60°C: 10 AWG copper, 30 A.

        UL 508A Table 28.1 60°C: 10 AWG copper, 30 A. UL 508A value, not verified
        against the standard.

        Governing conductor: 10 AWG. Both rules require it. UL 508A value, not verified
        against the standard.

        Branch device: inverse-time breaker, 250% × 21 A = 52.5 A (NEC Table 430.52(C)(1),
        squirrel-cage (other than Design B energy-efficient)).

        Selected rating 60 A, the next standard rating at or above 52.5 A. NEC 430.52(C)(1)(a):
        where the table value is not a standard rating in 240.6(A), the next higher
        standard rating is permitted.

        Overload setting 21 A. Trip not over 24.15 A (115%, NEC 430.32(A)(1), all
        other motors; not verified against an official NFPA text).

        Contactor continuous rating at least 21 A. Builtin library frame 32 A.

        Breaker rating 60 A is above the 32 A builtin frame. The next builtin frame
        is the 100 A MCCB. Placing the 32 A frame raises design check breaker_frame_below_rating.

        Control circuit: 16 AWG. Separate protection not over 10 A (Table 430.72(B)
        Column A; not verified against an official NFPA text). Inside the enclosure
        the branch device may be up to 40 A (Column B; not verified against an official
        NFPA text). UL 508A internal control ampacity for 16 AWG is 10 A. UL 508A
        value, not verified against the standard.'
      sizing_code: NEC
      flc_a: 21.0
      conductor_min_a: 26.25
      wire_gauge: 10 AWG
      wire_table: nec_310_16+ul_508a_28_1
      wire_temp_c: 60
