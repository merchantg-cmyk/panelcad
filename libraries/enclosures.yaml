# Standard US control-panel enclosures. You can add, hide, or edit rows.
#
# Sizes are height × width × depth in inches (Hoffman / Saginaw convention).
# Back-panel usable size uses the usual wall-mount collar-stud inset:
#   panel ≈ (H − 3 in) × (W − 3 in)
# Floor-mount rows use the same inset unless a row overrides it.
#
# catalog / manufacturer / url:
#   Only real catalog numbers confirmed on the maker's official product page.
#   Leave catalog blank when the number is not confirmed. Never invent one.
#   url is required whenever catalog is set.

library: enclosures
version: "1"

defaults:
  spare_pct: 0.25
  fill_target: 0.65          # aim for 60–70% of the back-panel area
  fill_min: 0.60
  fill_max: 0.70
  duct_face_in: 2.0          # 2 in wire-duct face on the back panel
  duct_depth_in: 3.0         # 3 in duct stand-off (box depth)
  rail_to_duct_in: 1.0
  wall_gutter_in: 0.5
  airflow_gap_in: 1.0        # around VFDs / transformers
  side_ducts: true
  ambient_c: 40.0            # typical US plant high
  max_internal_c: 50.0       # common PLC / electronics rating
  vfd_efficiency: 0.97
  psu_efficiency: 0.88
  transformer_efficiency: 0.95
  heat_k_steel: 5.5          # W/m²·K painted steel, natural convection
  heat_k_stainless: 4.5
  heat_k_nonmetallic: 3.5
  nema: "12"
  material: steel
  mount: any

enclosures:
