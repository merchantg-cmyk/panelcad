    io_type: DI
    source: https://literature.rockwellautomation.com/idc/groups/literature/documents/in/2085-in001_-en-p.pdf
    return_note: "COM0 is repeated four times on TB1 and COM1 four times on TB2 (2085-IN001). The sheet shows one COM0 and one COM1."
    points:
      - { pin: PT00, terminal: "I-00", index: 0 }
      - { pin: PT01, terminal: "I-01", index: 1 }
