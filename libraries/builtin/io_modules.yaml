      - { pin: C4, terminal: C4, role: common }

  # https://cdn.automationdirect.com/static/specs/c008td1.pdf page 1
  # C0-08TD1: 8-point sinking DC output, 3.3–27 VDC, 0.3 A/point, 1.2 A/common.
  # Two commons, four points each. C1 with 1–4, C2 with 5–8.
  # The wiring diagram and equivalent circuit show a +V terminal.
  # External DC power required: 21.6–26.4 VDC, max 15 mA (all outputs ON).
  # The L marks on that diagram are the loads on terminals 1–8, not a module terminal.
  # adc.click.c0_08td1 is a different, incomplete symbol and is not used here.
  - id: click.c0_08td1
    catalog: C0-08TD1
    manufacturer: AutomationDirect
    platform: click
    series: CLICK
    verified: true
    point_type: do_sink
    supply: 24VDC
    address_style: click
    io_type: DO
    source: https://cdn.automationdirect.com/static/specs/c008td1.pdf
    points:
      - { pin: "1", terminal: "1", index: 0 }
      - { pin: "2", terminal: "2", index: 1 }
      - { pin: "3", terminal: "3", index: 2 }
      - { pin: "4", terminal: "4", index: 3 }
      - { pin: "5", terminal: "5", index: 4 }
      - { pin: "6", terminal: "6", index: 5 }
      - { pin: "7", terminal: "7", index: 6 }
      - { pin: "8", terminal: "8", index: 7 }
    groups:
      - { common: C1, points: ["1", "2", "3", "4"] }
      - { common: C2, points: ["5", "6", "7", "8"] }
    power:
      - { pin: C1, terminal: C1, role: common }
      - { pin: C2, terminal: C2, role: common }
      - { pin: VP, terminal: "+V", role: supply_plus }

  # 5069-IN004. 16-point sinking 24 V DC input.
  # https://literature.rockwellautomation.com/idc/groups/literature/documents/in/5069-in004_-en-p.pdf
  # RTB terminals 0–15 are Input 0–15. Terminals 16 and 17 are No Connect.
  # The input common returns internally to SA(−) on the SA power RTB. It is not a module terminal.
  # 5069-IN004E-EN-P, June 2022, p.5: 5069-RTB18-SCREW or 5069-RTB18-SPRING.
  # "You must order RTBs separately. RTBs do not ship with Compact 5000 I/O modules."
  - id: ab.5069_ib16
    catalog: 5069-IB16
    manufacturer: Allen-Bradley
    platform: compactlogix
    series: Compact 5000
    verified: true
    point_type: di_sink
    supply: 24VDC
    address_style: logix
    io_type: DI
    source: https://literature.rockwellautomation.com/idc/groups/literature/documents/in/5069-in004_-en-p.pdf
    return_note: "Input common returns internally to SA(-) on the SA power RTB (controller, 5069-AENTR/AEN2TR, or 5069-FPD). Not a module terminal. 5069-IN004."
    points:
      - { pin: I00, terminal: "0", index: 0 }
      - { pin: I01, terminal: "1", index: 1 }
      - { pin: I02, terminal: "2", index: 2 }
      - { pin: I03, terminal: "3", index: 3 }
      - { pin: I04, terminal: "4", index: 4 }
      - { pin: I05, terminal: "5", index: 5 }
      - { pin: I06, terminal: "6", index: 6 }
      - { pin: I07, terminal: "7", index: 7 }
      - { pin: I08, terminal: "8", index: 8 }
      - { pin: I09, terminal: "9", index: 9 }
      - { pin: I10, terminal: "10", index: 10 }
      - { pin: I11, terminal: "11", index: 11 }
      - { pin: I12, terminal: "12", index: 12 }
      - { pin: I13, terminal: "13", index: 13 }
      - { pin: I14, terminal: "14", index: 14 }
      - { pin: I15, terminal: "15", index: 15 }
    unwired:
      - { pin: NC16, terminal: "16", role: nc }
      - { pin: NC17, terminal: "17", role: nc }
    accessories:
      # 5069-IN004E-EN-P June 2022 p.5. No width/height/depth on that page.
      - catalog: 5069-RTB18-SCREW
        description: "Removable terminal block, 18 screw terminals"
        note: "Ordered separately. 5069-RTB18-SPRING is the spring alternative. 5069-IN004E-EN-P June 2022 p.5."

