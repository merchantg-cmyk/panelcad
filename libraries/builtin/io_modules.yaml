# PLC I/O modules PanelCAD can draw. verified: true only when the terminal
# list below was read from the cited installation manual or wiring diagram.
# Unverified rows are listed so the wizard can say why they will not draw.
# Panel width/height/depth are omitted unless the cited page states them.
# A generic footprint is not a catalog dimension.
kind: io_modules
library: io
modules:
  # https://cdn.automationdirect.com/static/manuals/brxuserm/inserts/modules/bx-xxnd3.pdf
  # BRX discrete input insert, 1st Ed. Rev F, 2020-11-03.
  # BX-08ND3: 8-point 12–24 VDC sink/source, 2 isolated commons, 4 points each.
  # 1C with terminals 0–3, 2C with 4–7. Existing symbol adc.brx.bx_08nd3 matches.
  # Cut sheet: https://cdn.automationdirect.com/static/specs/cutsheet/BX-08ND3_cutsheet.pdf
  # Product: https://www.automationdirect.com/pn/BX-08ND3
  - id: brx.bx_08nd3
    catalog: BX-08ND3
    manufacturer: AutomationDirect
    platform: brx
    series: BRX
    library_id: adc.brx.bx_08nd3
    verified: true
    point_type: di_sink_source
    supply: 24VDC
    address_style: domore
    address_base: 0
    source: https://cdn.automationdirect.com/static/manuals/brxuserm/inserts/modules/bx-xxnd3.pdf
    points:
      - { pin: "0", terminal: "0", index: 0 }
      - { pin: "1", terminal: "1", index: 1 }
      - { pin: "2", terminal: "2", index: 2 }
      - { pin: "3", terminal: "3", index: 3 }
      - { pin: "4", terminal: "4", index: 4 }
      - { pin: "5", terminal: "5", index: 5 }
      - { pin: "6", terminal: "6", index: 6 }
      - { pin: "7", terminal: "7", index: 7 }
    groups:
      - { common: "1C", points: ["0", "1", "2", "3"] }
      - { common: "2C", points: ["4", "5", "6", "7"] }
    power:
      - { pin: "1C", terminal: "1C", role: common }
      - { pin: "2C", terminal: "2C", role: common }

  # Same insert. BX-12ND3 adds 3C with terminals 8–11.
  # https://www.automationdirect.com/pn/BX-12ND3
  - id: brx.bx_12nd3
