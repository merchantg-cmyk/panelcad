  # 2085-IN001F-EN-P, January 2025. 16-point 12/24 V DC sink/source input.
  # https://literature.rockwellautomation.com/idc/groups/literature/documents/in/2085-in001_-en-p.pdf
  # TB1: I-00, I-01, COM0, I-02, I-03, COM0, I-04, I-05, COM0, I-06, I-07, COM0.
  # TB2: I-08, I-09, COM1, I-10, I-11, COM1, I-12, I-13, COM1, I-14, I-15, COM1.
  # COM0 and COM1 are each repeated four times on the RTB. The sheet shows one of each.
  # Addresses are Micro800 variables, not Logix Local: tags.
  # 2080-UM003: discrete inputs are read from _IO_Xx_DI_yy.
