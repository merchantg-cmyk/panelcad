      - { pin: Q11, terminal: "11", index: 11 }
      - { pin: Q12, terminal: "12", index: 12 }
      - { pin: Q13, terminal: "13", index: 13 }
      - { pin: Q14, terminal: "14", index: 14 }
      - { pin: Q15, terminal: "15", index: 15 }
    power:
