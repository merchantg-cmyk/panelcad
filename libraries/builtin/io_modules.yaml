      - { pin: PT15, terminal: "I-15", index: 15 }
    groups:
      - { common: COM0, points: [PT00, PT01, PT02, PT03, PT04, PT05, PT06, PT07] }
      - { common: COM1, points: [PT08, PT09, PT10, PT11, PT12, PT13, PT14, PT15] }
