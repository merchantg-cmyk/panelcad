  # 5069-IN010E-EN-P, August 2023, page 9. 8-channel current/voltage input.
  # https://literature.rockwellautomation.com/idc/groups/literature/documents/in/5069-in010_-en-p.pdf
  # Terminals 0/1 are Input 0+/0−, through 14/15 Input 7+/7−.
  # Terminals 16 and 17 are Shield (page 9). "Terminal inputs 0−…7− are internally connected."
  # A 4-wire device lands Signal − on Input n−. Its supply is separate from SA.
  # Page 9: "Use separate external power supplies to provide SA power to the system
  # and to power external devices that are connected to the module."
  # Page 10: "No isolation between individual input ports." That is not a bond to the 24 V 0 V rail.
  - id: ab.5069_if8
    catalog: 5069-IF8
    manufacturer: Allen-Bradley
    platform: compactlogix
    series: Compact 5000
    verified: true
    point_type: ai
    supply: 24VDC
    address_style: logix
    io_type: AI
    source: https://literature.rockwellautomation.com/idc/groups/literature/documents/in/5069-in010_-en-p.pdf
    return_note: "Terminal inputs 0- through 7- are internally connected. Terminals 16 and 17 are Shield. Use a separate external supply for 4-wire devices. 5069-IN010E-EN-P August 2023 p.9."
    points:
      - { pin: AI0, terminal: "0+", index: 0, pair: M0 }
      - { pin: AI1, terminal: "1+", index: 1, pair: M1 }
      - { pin: AI2, terminal: "2+", index: 2, pair: M2 }
      - { pin: AI3, terminal: "3+", index: 3, pair: M3 }
      - { pin: AI4, terminal: "4+", index: 4, pair: M4 }
      - { pin: AI5, terminal: "5+", index: 5, pair: M5 }
      - { pin: AI6, terminal: "6+", index: 6, pair: M6 }
      - { pin: AI7, terminal: "7+", index: 7, pair: M7 }
    power:
      - { pin: M0, terminal: "0-", role: signal_minus, point: AI0 }
      - { pin: M1, terminal: "1-", role: signal_minus, point: AI1 }
      - { pin: M2, terminal: "2-", role: signal_minus, point: AI2 }
      - { pin: M3, terminal: "3-", role: signal_minus, point: AI3 }
      - { pin: M4, terminal: "4-", role: signal_minus, point: AI4 }
      - { pin: M5, terminal: "5-", role: signal_minus, point: AI5 }
      - { pin: M6, terminal: "6-", role: signal_minus, point: AI6 }
      - { pin: M7, terminal: "7-", role: signal_minus, point: AI7 }
      - { pin: SH16, terminal: "16", role: shield }
      - { pin: SH17, terminal: "17", role: shield }
    accessories:
