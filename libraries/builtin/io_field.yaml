# Generic field symbols for generated PLC I/O sheets.
# These are schematic shapes, not manufacturer catalog numbers.
library: iec
version: "0.1"
devices:
  - id: connection.junction
    name: Wire junction
    category: connection.node
    ref_prefix: J
    tags: [node, junction, tee]
    schematic:
      width: 6
      height: 6
      pins:
        # All four pins meet at the center so a tee dot sits on the wire joint.
        - { id: W, x: 3, y: 3, side: left }
        - { id: E, x: 3, y: 3, side: right }
        - { id: N, x: 3, y: 3, side: top }
        - { id: S, x: 3, y: 3, side: bottom }
      draw:
        - { circle: [3, 3, 1.3], fill: true }
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: none, dims: generic }
    props: { location: schematic-only }

  - id: connection.waypoint
    name: Wire corner
    category: connection.node
    ref_prefix: W
    tags: [node, corner, elbow]
    schematic:
      width: 2
      height: 2
      pins:
        # Pins meet at the center. No draw, so a two-wire elbow has no junction dot.
        - { id: W, x: 1, y: 1, side: left }
        - { id: E, x: 1, y: 1, side: right }
        - { id: N, x: 1, y: 1, side: top }
        - { id: S, x: 1, y: 1, side: bottom }
      draw: []
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: none, dims: generic }
    props: { location: schematic-only }

  - id: notes.spare
    name: Spare I/O
    category: connection.notes
    ref_prefix: SPR
    tags: [spare, io]
    schematic:
      width: 28
      height: 10
      pins: []
      draw:
        - text: [2, 7, "SPARE", 2.4]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: none, dims: generic }
    props: { location: schematic-only }

  - id: operators.prox_3wire
    name: 3-wire proximity switch
    category: operator.limit
    ref_prefix: PRX
    tags: [prox, sensor, "3-wire"]
    schematic:
      width: 36
      height: 28
      pins:
        # BN brown to +24, BU blue to 0 V, BK black to the input. Generic IEC colors, not a catalog sensor.
        - { id: BN, x: 8, y: 0, side: top, electrical: power }
        - { id: BU, x: 8, y: 28, side: bottom, electrical: power }
        - { id: BK, x: 36, y: 14, side: right, electrical: output }
      draw:
        - rect: [6, 6, 22, 16]
        - circle: [17, 14, 4]
        - line: [8, 0, 8, 6]
        - line: [8, 22, 8, 28]
        - line: [28, 14, 36, 14]
        - text: [17, 16, "3W", 2.2]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 3, location: field }

  - id: loads.transmitter_2wire
    name: 2-wire transmitter
    category: load.transmitter
    ref_prefix: TT
    tags: [transmitter, analog, "4-20ma", "2-wire"]
    schematic:
      width: 36
      height: 28
      pins:
        - { id: PLUS, x: 0, y: 14, side: left, electrical: power }
        - { id: SIG, x: 36, y: 14, side: right, electrical: output }
      draw:
        - circle: [18, 14, 8]
        - line: [0, 14, 10, 14]
        - line: [26, 14, 36, 14]
        - text: [18, 16, "4-20", 2.0]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 2, signal: "4-20mA", location: field }

  - id: loads.transmitter_4wire
    name: 4-wire transmitter
    category: load.transmitter
    ref_prefix: TT
    tags: [transmitter, analog, "4-20ma", "4-wire"]
    schematic:
      width: 40
      height: 28
      pins:
        - { id: PWR, x: 0, y: 8, side: left, electrical: power }
        - { id: PWR0, x: 0, y: 20, side: left, electrical: power }
        - { id: SIG, x: 40, y: 8, side: right, electrical: output }
        - { id: SIG0, x: 40, y: 20, side: right, electrical: output }
      draw:
        - rect: [8, 4, 24, 20]
        - line: [0, 8, 8, 8]
        - line: [0, 20, 8, 20]
        - line: [32, 8, 40, 8]
        - line: [32, 20, 40, 20]
        - text: [20, 16, "4W", 2.2]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 4, signal: "4-20mA", location: field }
