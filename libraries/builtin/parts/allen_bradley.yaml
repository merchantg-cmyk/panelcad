# Allen-Bradley catalog parts. Every number is on a Rockwell product page
# or publication listed in `source:`. Blank fields were not published there.
# Do not invent catalog numbers, dimensions, or ratings.
kind: manufacturer_parts
manufacturer: Allen-Bradley
version: "0.1"

# 100-C coil code after the current rating. Official construction rule:
# 100-TD013 "The Cat. No. as listed is incomplete… 100-C09◊10 becomes 100-C09D10".
suffix_rules:
  - id: 100-c-coil
    placeholder: coil
    source: https://literature.rockwellautomation.com/idc/groups/literature/documents/td/100-td013_-en-p.pdf
    description: >
      100-C / 104-C coil voltage codes (100-TD013, Coil Voltage Codes table).
      D = 110 V 50 Hz / 120 V 60 Hz. KJ = 24 V 50/60 Hz. EJ = 24 V DC
      electronic with integrated diode (100-C09…C55).
    codes:
      - { code: D, coil_voltage: "110VAC 50Hz / 120VAC 60Hz" }
      - { code: KJ, coil_voltage: "24VAC 50/60Hz" }
      - { code: EJ, coil_voltage: "24VDC" }

