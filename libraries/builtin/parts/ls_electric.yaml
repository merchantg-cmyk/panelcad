# LS Electric (formerly LSIS). Filled fields on a verified:full row are in the cited PDF.
# S100 amps stay on the watt-loss bulletin. Outlines are section 7.3 of the simple manual, so those rows stay partial.
# MMS-32H is the 2023 catalog spelling. MMS-32S is not a row.
# BKN 3P C6A is the C-curve 3-pole 6 A row in the LSIS MCB catalog on ls-electric.com.
# 17.8 mm per pole is not stored as an outline (the page does not print a 3-pole W×H×D).
# source_date is the day these pages were read.
kind: manufacturer_parts
manufacturer: LS Electric
version: "0.1"

parts:
  - catalog: BKN 3P C6A
    library_id: iec.breakers.mcb_3p_32a
    category: protection.breaker
    description: "BKN miniature circuit breaker, 3-pole, C curve, 6 A, 6 kA at 400 VAC"
    verified: partial
    source: "https://www.ls-electric.com/upload/customer/download/1483/MCB_E_180131.pdf"
    source_date: "2026-10-08"
    series: BKN
    amps: 6
    poles: 3
    ka: 6
    mounting: din
    notes: "MCB catalog on ls-electric.com. BKN type technical data: 2, 3, 4 pole rated 400 VAC, breaking capacity 6 kA, poles include 3P, mounting on 35 mm DIN rail, width 17.8 mm per pole. Series table: BKN poles include 3P and the C curve, mount on 35 mm DIN rail, 2-4 pole breaking capacity 6 kA at 400 VAC. Order table heading BKN type, C curve, 6 kA at 400 VAC, model column BKN 3P C6A, In 6 A, order No. 06130054R0. 17.8 mm per pole is not a 3-pole outline, so width_mm, height_mm, and depth_mm stay blank and verified stays partial."

