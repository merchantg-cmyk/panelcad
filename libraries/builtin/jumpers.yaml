# Terminal jumpers (plug-in bridges / comb bars).
#
# To add a jumper: add a row under jumpers: → items. Matching uses jumper_family + pitch_mm
# + poles. Old projects still store only properties.jumper on the terminal; the
# BOM and strip export derive the part from this table.
#
# Full devices:[] entries also work if you need a custom schematic.
library: iec
version: "0.1"

jumpers:
  - family: generic
    pitch_mm: 5.2
    manufacturer: ""
    kind: bridge
    items:
      - { poles: 2, part_number: "Jumper 2-pole 5.2 mm" }
      - { poles: 3, part_number: "Jumper 3-pole 5.2 mm" }
      - { poles: 4, part_number: "Jumper 4-pole 5.2 mm" }
      - { poles: 5, part_number: "Jumper 5-pole 5.2 mm" }
      - { poles: 10, part_number: "Jumper 10-pole 5.2 mm", cut_to_length: true }

  - family: generic
