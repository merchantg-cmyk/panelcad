# Keyence and SMC parts. Dimensions from public cut sheets (2026-08).
# Manufacturer names are trademarks of their owners.
# Pin ids stay wireable (I0/Q0); `label` is what the OEM prints on the block.
library: oem
version: "0.1"
devices:
  - id: keyence.kv_b16xc
    name: KV-B16XC 16-pt input
    category: control.plc
    ref_prefix: A
    tags: [keyence, kv, input]
    schematic:
      width: 50
      height: 110
      pins:
        - { id: Lplus, x: 0, y: 10, side: left, electrical: power, label: "24V" }
        - { id: M, x: 0, y: 18, side: left, electrical: power, label: "0V" }
        - { id: I0, x: 0, y: 30, side: left, electrical: input, label: X0 }
        - { id: I1, x: 0, y: 38, side: left, electrical: input, label: X1 }
        - { id: I2, x: 0, y: 46, side: left, electrical: input, label: X2 }
        - { id: I3, x: 0, y: 54, side: left, electrical: input, label: X3 }
        - { id: I4, x: 0, y: 62, side: left, electrical: input, label: X4 }
        - { id: I5, x: 0, y: 70, side: left, electrical: input, label: X5 }
        - { id: I6, x: 0, y: 78, side: left, electrical: input, label: X6 }
        - { id: I7, x: 0, y: 86, side: left, electrical: input, label: X7 }
      draw:
        - rect: [8, 6, 34, 98]
        - text: [25, 20, "KV-B16X", 2.4]
    panel: { w: 28.5, h: 90.0, d: 76.0, din: true, in_panel: true, mount: din_rail, dims: catalog }
    props:
      manufacturer: Keyence
      part_number: KV-B16XC
      catalog: KV-B16XC
      DI: 16
      supply: 24VDC

