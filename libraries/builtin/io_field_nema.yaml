# NEMA copies of the generic I/O field symbols. Not manufacturer catalog numbers.
library: nema
version: "0.1"
devices:
  - id: operators.prox_3wire
    name: 3-wire proximity switch
    category: operator.limit
    ref_prefix: PRX
    tags: [prox, sensor, "3-wire"]
    schematic:
      width: 36
      height: 28
      pins:
        - { id: BN, x: 8, y: 0, side: top, electrical: power }
        - { id: BU, x: 8, y: 28, side: bottom, electrical: power }
        - { id: BK, x: 36, y: 14, side: right, electrical: output }
      draw:
        - rect: [6, 6, 22, 16]
        - circle: [17, 14, 4]
        - line: [8, 0, 8, 6]
        - line: [8, 22, 8, 28]
        - line: [28, 14, 36, 14]
        - text: [17, 16, "3W", 2.2]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 3, location: field }

  - id: loads.transmitter_2wire
    name: 2-wire transmitter
    category: load.transmitter
    ref_prefix: TT
    tags: [transmitter, analog, "4-20ma", "2-wire"]
    schematic:
      width: 36
      height: 28
      pins:
        - { id: PLUS, x: 0, y: 14, side: left, electrical: power }
        - { id: SIG, x: 36, y: 14, side: right, electrical: output }
      draw:
        - circle: [18, 14, 8]
        - line: [0, 14, 10, 14]
        - line: [26, 14, 36, 14]
        - text: [18, 16, "4-20", 2.0]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 2, signal: "4-20mA", location: field }

  - id: loads.transmitter_4wire
    name: 4-wire transmitter
    category: load.transmitter
    ref_prefix: TT
    tags: [transmitter, analog, "4-20ma", "4-wire"]
    schematic:
      width: 40
      height: 28
      pins:
        - { id: PWR, x: 0, y: 8, side: left, electrical: power }
        - { id: PWR0, x: 0, y: 20, side: left, electrical: power }
        - { id: SIG, x: 40, y: 8, side: right, electrical: output }
        - { id: SIG0, x: 40, y: 20, side: right, electrical: output }
      draw:
        - rect: [8, 4, 24, 20]
        - line: [0, 8, 8, 8]
        - line: [0, 20, 8, 20]
        - line: [32, 8, 40, 8]
        - line: [32, 20, 40, 20]
        - text: [20, 16, "4W", 2.2]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { wires: 4, signal: "4-20mA", location: field }

  # Rectangle with a slash: the usual NEMA solenoid on a ladder. Not a catalog
  # number, and not claimed as a numbered NFPA figure. Distinct from the round
  # coil in nema.yaml / the IEC circle in power_terminals.yaml.
  - id: loads.solenoid
    name: Solenoid
    category: load.solenoid
    ref_prefix: Y
    tags: [solenoid, valve]
    schematic:
      width: 22
      height: 14
      pins:
        - { id: A1, x: 0, y: 7, side: left, electrical: input }
        - { id: A2, x: 22, y: 7, side: right, electrical: input }
      draw:
        - rect: [4, 2, 14, 10]
        - line: [0, 7, 4, 7]
        - line: [18, 7, 22, 7]
        - line: [6, 10, 16, 4]
    panel: { w: 0, h: 0, d: 0, din: false, in_panel: false, mount: field, dims: generic }
    props: { location: field }
